id: ai.usemagpie.Magpie
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk
command: magpie
separate-locales: false
build-options:
  no-debuginfo: true
finish-args:
  - --share=ipc
  # Providers, model catalogs and Magpie's loopback model gateway.
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  # The Wails WebKitGTK UI uses the system webview and benefits from GPU rendering.
  - --device=dri
  # The menu-bar/status notifier integration uses the session bus.
  - --talk-name=org.kde.StatusNotifierWatcher
  # Wails single-instance name has a user/path-derived hash under this prefix.
  - --own-name=ai.usemagpie.app.*
  - --filesystem=xdg-run/tray-icon:create
  # Magpie's main feature reads and updates these agent configuration directories.
  # They may contain provider keys, OAuth tokens, or other credentials.
  # No :create: Magpie treats an existing directory as "agent installed", and an
  # agent installed later is picked up on Magpie's next launch.
  - --filesystem=~/.claude
  - --filesystem=~/.codex
  - --filesystem=~/.gemini
  - --filesystem=~/.config/opencode
  - --filesystem=~/.pi/agent
  - --filesystem=~/.config/goose
  - --filesystem=~/.cursor
  - --filesystem=~/.copilot
  - --filesystem=~/.grok
  - --filesystem=~/.config/crush
  - --filesystem=~/.dsh
  - --filesystem=~/.commandcode
  - --filesystem=~/.omp/agent
  - --filesystem=~/.config/devin
  - --filesystem=~/.local/share/devin
  - --filesystem=~/.hermes
modules:
  - name: magpie
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - install -Dm755 magpie-wrapper /app/bin/magpie
      - install -Dm644 ai.usemagpie.Magpie.desktop /app/share/applications/ai.usemagpie.Magpie.desktop
      - install -Dm644 ai.usemagpie.Magpie.metainfo.xml /app/share/metainfo/ai.usemagpie.Magpie.metainfo.xml
      - install -Dm644 ai.usemagpie.Magpie.svg /app/share/icons/hicolor/scalable/apps/ai.usemagpie.Magpie.svg
    sources:
      # BEGIN MANAGED EXTRA-DATA
      - type: extra-data
        filename: magpie-linux-amd64
        only-arches:
          - x86_64
        url: https://github.com/yetone/magpie-releases/releases/download/v0.1.384/magpie-linux-amd64
        sha256: 7955c5853b5853e700383c21a08d45edb80c713240a33ab8e393fa20bcf000ac
        size: 25862000
      - type: extra-data
        filename: magpie-linux-arm64
        only-arches:
          - aarch64
        url: https://github.com/yetone/magpie-releases/releases/download/v0.1.384/magpie-linux-arm64
        sha256: d91aeed5efa034e52700fd22466f5c01c32743338d841e77b82a453b20bac7d8
        size: 23900984
      # END MANAGED EXTRA-DATA
      - type: file
        path: apply_extra.sh
      - type: file
        path: magpie-wrapper
      - type: file
        path: ai.usemagpie.Magpie.desktop
      - type: file
        path: ai.usemagpie.Magpie.metainfo.xml
      - type: file
        path: ai.usemagpie.Magpie.svg
